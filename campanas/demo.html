<!doctype html>

<title>Campañas · Brío Café (demo)</title>
<style>
/* Layout: micrositio a la izquierda, teléfono a la derecha con su bitácora; en pantalla angosta se apilan. */
:root {
  --bg: #EEF1F5; --surface: #FFFFFF; --surface-2: #F6F8FB; --ink: #14181F; --muted: #5A6372; --line: #D9DFE7;
  --accent: #8A4B22; --accent-ink: #FFFFFF; --accent-soft: #F6EADF; --accent-text: #6E3A17;
  --ok: #1D7543; --ok-soft: #E2F3E9; --warn: #8A5300; --warn-soft: #FCEFD9; --bad: #B0261D; --bad-soft: #FBE6E4;
  --phone-frame: #1B1F26; --scrim: rgba(12,15,20,0.55); --hero-1: #2B1A10; --hero-2: #5A3520;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --f-body: system-ui, "Segoe UI", Roboto, sans-serif; --f-mono: ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1217; --surface: #181C23; --surface-2: #1F242D; --ink: #E8ECF2; --muted: #9AA4B3; --line: #2C333E;
  --accent: #E0A878; --accent-ink: #1A1009; --accent-soft: #3A281B; --accent-text: #F0C49C;
  --ok: #6FD39A; --ok-soft: #173325; --warn: #F0B65A; --warn-soft: #3A2C14; --bad: #F08A80; --bad-soft: #3D1C19;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --phone-frame: #000000; --scrim: rgba(0,0,0,0.65); --hero-1: #1A0F08; --hero-2: #3D2414; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1217; --surface: #181C23; --surface-2: #1F242D; --ink: #E8ECF2; --muted: #9AA4B3; --line: #2C333E;
  --accent: #E0A878; --accent-ink: #1A1009; --accent-soft: #3A281B; --accent-text: #F0C49C;
  --ok: #6FD39A; --ok-soft: #173325; --warn: #F0B65A; --warn-soft: #3A2C14; --bad: #F08A80; --bad-soft: #3D1C19;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --phone-frame: #000000; --scrim: rgba(0,0,0,0.65); --hero-1: #1A0F08; --hero-2: #3D2414; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { text-wrap: balance; margin: 0 }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.wrap { max-width: 1720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px }
.topbar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between }
.topbar h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em }
.topbar p { margin: 2px 0 0; color: var(--muted); font-size: 13px }
.dia { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 6px 6px 12px }
.dia .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted) }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 24px; align-items: start }
@media (max-width: 1180px) { .stage { grid-template-columns: minmax(0, 1fr) } .side { justify-self: center } }

/* Micrositio */
.site { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0 }
.site-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line) }
.brand { display: flex; align-items: center; gap: 10px }
.brand .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800 }
.brand b { display: block; font-size: 15px }
.brand small { color: var(--muted); font-size: 12px }
.tabs { display: flex; gap: 4px; flex-wrap: wrap }
.tab { border: 0; background: transparent; padding: 9px 14px; border-radius: 8px; font-weight: 700; color: var(--muted); min-height: 40px }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-text) }
.pubwrap { display: flex; align-items: center; gap: 10px }
.pend { font-size: 12px; font-weight: 700; color: var(--warn); background: var(--warn-soft); padding: 4px 10px; border-radius: 999px }
.pend.ok { color: var(--ok); background: var(--ok-soft) }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px 14px; font-weight: 700; min-height: 40px }
.btn:hover { background: var(--surface-2) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.primary:hover { filter: brightness(1.06) }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--surface) }
.btn.danger { color: var(--bad); border-color: var(--bad-soft) }
.btn.sm { padding: 6px 10px; min-height: 34px; font-size: 13px }
.btn.icon { width: 34px; padding: 0; display: grid; place-items: center }
.body { padding: 26px; display: grid; gap: 22px }
.cols { display: grid; grid-template-columns: minmax(300px, 420px) minmax(0, 1fr); gap: 24px; align-items: start }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr) } }
.panel { border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 16px; background: var(--surface); min-width: 0 }
.panel h2 { font-size: 19px; font-weight: 800 }
.panel.editing { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.hint { color: var(--muted); font-size: 13.5px; margin: -6px 0 0 }
.field { display: grid; gap: 6px }
.field > span { font-size: 12.5px; font-weight: 700 }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px 11px; min-height: 40px }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.preview { width: 100%; max-height: 220px; object-fit: contain; border-radius: 9px; background: var(--surface-2); display: block }
.filerow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.filelbl { position: relative; overflow: hidden }
.filelbl input { position: absolute; inset: 0; opacity: 0; cursor: pointer }
.count { font-size: 13px; color: var(--muted) }
.count b { color: var(--ink) }
.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px }
.card { border: 1px solid var(--line); border-radius: 11px; overflow: hidden; display: flex; flex-direction: column; background: var(--surface) }
.card img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; background: var(--surface-2) }
.card.off img { opacity: 0.4; filter: grayscale(1) }
.card .meta { padding: 14px; display: grid; gap: 10px }
.card .t { font-weight: 700; font-size: 15px }
.card .acts { display: flex; gap: 6px; flex-wrap: wrap }
.pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; width: fit-content }
.pill.ok { background: var(--ok-soft); color: var(--ok) }
.pill.off { background: var(--surface-2); color: var(--muted) }
.pill.warn { background: var(--warn-soft); color: var(--warn) }
.pill.acc { background: var(--accent-soft); color: var(--accent-text) }
.chips { display: flex; gap: 8px; flex-wrap: wrap }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 700; min-height: 38px }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.lines { display: grid; gap: 18px }
.line-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.line-h h3 { font-size: 17px; font-weight: 800 }
.slot { display: grid; grid-template-columns: 24px 48px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line) }
.slot.quita { background: var(--bad-soft); margin: 0 -10px; padding: 12px 10px; border-radius: 10px }
.slot img { width: 48px; height: 60px; object-fit: cover; border-radius: 5px }
.slot .t { font-weight: 700; font-size: 15px }
.slot .d { font-size: 13px; color: var(--muted) }
.slot .mv { display: flex; gap: 4px }
.empty { color: var(--muted); font-size: 13px; padding: 6px 0 }
.repl { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 12px; padding: 14px; display: grid; gap: 10px }
.repl h3 { font-size: 15px; color: var(--ink) }
.opt { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; cursor: pointer }
.opt img { width: 28px; height: 35px; object-fit: cover; border-radius: 4px }
.tbl-wrap { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 13.5px }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; padding: 8px; border-bottom: 1px solid var(--line) }
td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle }
td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right }
th.n { text-align: right }
.bar { height: 8px; border-radius: 4px; background: var(--accent); min-width: 2px }
.toast { padding: 11px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-text); font-weight: 600; font-size: 13.5px }
.toast.bad { background: var(--bad-soft); color: var(--bad) }
.modal { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 50 }
.dialog { background: var(--surface); border-radius: 14px; padding: 22px; width: min(420px, 100%); display: grid; gap: 12px }
.dialog h2 { font-size: 18px }
.dialog p { margin: 0; color: var(--muted) }
.dialog .acts { display: flex; justify-content: flex-end; gap: 8px }

/* Teléfono */
.side { display: grid; gap: 14px; width: 100%; max-width: 420px }
.phone { width: 100%; max-width: 410px; aspect-ratio: 390 / 820; background: var(--phone-frame); border-radius: 46px; padding: 12px; margin: 0 auto }
.screen { position: relative; width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: var(--surface-2); display: flex; flex-direction: column }
.sbar { height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 12.5px; font-weight: 700; background: var(--surface) }
.sbar .lns { display: flex; gap: 4px }
.sbar .lns button { border: 0; border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 700; background: var(--surface-2); color: var(--muted) }
.sbar .lns button[aria-pressed="true"] { background: var(--ink); color: var(--surface) }
.login { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 28px; background: var(--surface) }
.login h2 { font-size: 26px; font-weight: 800 }
.login p { margin: 0 0 8px; color: var(--muted); font-size: 13.5px }
.fake { height: 46px; border: 1px solid var(--line); border-radius: 10px; display: flex; align-items: center; padding: 0 14px; color: var(--muted) }
.big { height: 50px; border: 0; border-radius: 11px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 15px; margin-top: 6px }
.apphead { height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 18px; background: var(--surface); border-bottom: 1px solid var(--line) }
.apphead b { font-size: 17px }
.appbody { flex: 1; overflow-y: auto; padding: 14px; display: grid; gap: 12px; align-content: start }
.tile { background: var(--surface); border-radius: 14px; padding: 16px }
.tile small { color: var(--muted) }
.tile .amt { font-size: 24px; font-weight: 800; margin-top: 2px }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.gcard { border: 0; padding: 0; background: var(--surface); border-radius: 12px; overflow: hidden; text-align: left }
.gcard img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block }
.gcard span { display: block; padding: 8px 10px 10px; font-size: 12.5px; font-weight: 700 }
.nav { height: 60px; flex: none; display: flex; background: var(--surface); border-top: 1px solid var(--line) }
.nav button { flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 700; color: var(--muted) }
.nav button[aria-current="page"] { color: var(--accent) }
.over { position: absolute; inset: 40px 0 0 0; background: rgba(10,12,16,0.86); display: flex; flex-direction: column; justify-content: center; padding: 18px; gap: 12px; z-index: 5 }
.over .top { display: flex; justify-content: space-between; align-items: center; color: #FFFFFF; font-size: 12.5px }
.skip { border: 1px solid rgba(255,255,255,0.6); background: transparent; color: #FFFFFF; border-radius: 999px; padding: 7px 15px; font-weight: 700 }
.carr { position: relative; width: 100%; aspect-ratio: 10 / 5; perspective: 700px; touch-action: pan-y; user-select: none }
.slide { position: absolute; top: 0; left: 36.25%; width: 27.5%; border-radius: 14px; overflow: hidden; background: #FFFFFF; color: #14181F; cursor: pointer;
  transition: transform 0.55s cubic-bezier(.2,.7,.2,1), opacity 0.55s; transform-style: preserve-3d; box-shadow: 0 14px 30px rgba(0,0,0,0.35) }
@media (prefers-reduced-motion: reduce) { .slide { transition: none } }
.slide img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; pointer-events: none }
.slide div { padding: 5px 6px 6px }
.slide b { display: block; font-size: 10.5px; line-height: 1.25 }
.slide small { display: none }
.sfechas { display: grid; grid-template-columns: repeat(2, minmax(0, 150px)); gap: 8px; margin: 6px 0 4px }
.sfechas label { display: grid; gap: 3px }
.sfechas span { font-size: 11px; font-weight: 700; color: var(--muted) }
.sfechas .input { min-height: 34px; padding: 5px 8px; font-size: 12.5px }
.dots { display: flex; justify-content: center; gap: 7px }
.dots i { width: 7px; height: 7px; border-radius: 4px; background: rgba(255,255,255,0.35) }
.dots i.on { background: #FFFFFF; width: 18px }
.over .note { text-align: center; color: rgba(255,255,255,0.75); font-size: 11.5px }
/* Banner agrandado: tarjeta corta al centro y lo de atrás se queda visible pero desenfocado, como vidrio esmerilado. */
.zoom { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 16px; background: rgba(10,12,16,0.28);
  -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); animation: zoom-f 0.35s ease-out }
.zoom .card { position: relative; width: 88%; display: grid; border-radius: 18px; overflow: hidden; background: rgba(255,255,255,0.14);
  border: 1px solid rgba(255,255,255,0.28); box-shadow: 0 18px 44px rgba(0,0,0,0.35); animation: zoom-c 0.35s cubic-bezier(.22,.61,.36,1) }
.zoom img { display: block; width: 100%; aspect-ratio: 4 / 5; max-height: 52vh; object-fit: cover }
.zoom b { color: #FFFFFF; background: rgba(10,12,16,0.55); text-align: center; padding: 10px 14px 12px; font-size: 15px }
.zoom .x { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 17px; border: 0; background: rgba(0,0,0,0.38); display: grid; place-items: center }
@keyframes zoom-f { from { opacity: 0 } to { opacity: 1 } }
@keyframes zoom-c { from { opacity: 0; transform: scale(.9) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) { .zoom, .zoom .card { animation: none } }
.notif { position: absolute; top: 48px; left: 10px; right: 10px; z-index: 8; background: var(--surface); color: var(--ink); border-radius: 14px; box-shadow: 0 10px 28px rgba(0,0,0,0.25); padding: 11px 12px; display: flex; gap: 10px; align-items: center; animation: drop 0.25s ease-out }
.notif .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); flex: none }
.notif div { flex: 1; min-width: 0; font-size: 12.5px }
.notif div b { display: block; font-size: 12.5px }
@keyframes drop { from { transform: translateY(-12px); opacity: 0.4 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .notif { animation: none } }
.log { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px }
.log h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted) }
.log ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; max-height: 190px; overflow-y: auto }
.log li { font-size: 12.5px; display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px }
.log li span { color: var(--muted); font-family: var(--f-mono); font-size: 11.5px }
.foot { color: var(--muted); font-size: 12px }

/* Acceso con Google (simulado) */
.link { border: 0; background: none; padding: 0; color: var(--accent-text); font-weight: 700; font-size: inherit; text-decoration: underline }
.glogin { container-type: inline-size; background: var(--surface-2) }
.gshell { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); min-height: 640px }
.ghero { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; padding: clamp(28px, 5cqi, 56px);
  background: linear-gradient(180deg, var(--hero-1), var(--hero-2)); color: #fff; font-family: var(--f-body) }
.gsym { position: absolute; top: -80px; right: -120px; width: 420px; height: 420px; border-radius: 50%; border: 56px solid #fff; opacity: .07; transform: rotate(-15deg); pointer-events: none }
.gword { position: relative; font-weight: 700; font-size: 20px; letter-spacing: -.01em }
.ghead { position: relative; margin: 0; display: flex; flex-direction: column; font-size: clamp(30px, 5.5cqi, 52px); font-weight: 700; line-height: 1.05; letter-spacing: -.02em }
.gacc { background: linear-gradient(90deg, #F3C58F, #fff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent }
.gver { position: relative; margin: 0; font-size: 13px; color: rgba(255,255,255,.7) }
.gpanel { position: relative; display: grid; place-items: center; padding: 62px 16px clamp(20px, 4cqi, 44px) }
.tema { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; font-size: 17px; line-height: 1; cursor: pointer }
.tema:hover { border-color: var(--accent) }
.gpanel > .tema { position: absolute; top: 14px; right: 14px }
.brand .tema { margin-left: 4px }
@container (max-width: 700px) {
  .gshell { grid-template-columns: 1fr; min-height: 0 }
  .ghero { flex-direction: row; align-items: center; padding: 18px 22px }
  .ghead, .gsym, .gver { display: none }
  .gpanel { padding-top: 60px }
}
.gcard2 { width: min(440px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 32px 28px; display: grid; gap: 14px }
.gmark { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: 22px; color: var(--accent) }
.gcard2 h2 { font-size: 24px; font-weight: 700 }
.gcard2 > p { margin: -8px 0 0; color: var(--muted) }
.dom { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; line-height: 1.6 }
.dom b { color: var(--ink) }
.cuentas { display: grid; border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.cuenta { display: flex; gap: 12px; align-items: center; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); padding: 11px 14px }
.cuenta:last-child { border-bottom: 0 }
.cuenta:hover { background: var(--surface-2) }
.cuenta .av { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; font-weight: 800; flex: none }
.cuenta b { display: block; font-size: 14px }
.cuenta small { color: var(--muted); font-size: 12.5px }

/* Segmentos y categorías */
.chip.sm { padding: 5px 11px; min-height: 32px; font-size: 12.5px }
.appcats { gap: 6px }
.appcats .chip.sm { min-height: 28px; padding: 3px 9px; font-size: 11.5px }

/* Tablero de analítica: una sola medida, un solo tono (accent). */
.dash { display: grid; gap: 18px }
.filtros { display: flex; flex-wrap: wrap; gap: 14px 24px }
.filtros > .field { flex: 0 0 auto; min-width: 0 }
.fbus { display: grid; grid-template-columns: 172px 258px; gap: 8px; align-items: start }

    },
